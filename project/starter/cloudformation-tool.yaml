AWSTemplateFormatVersion: '2010-09-09'
Description: Bug report tool - DynamoDB table, Lambda function, and IAM role

Resources:

  BugReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
